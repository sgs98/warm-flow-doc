<svg viewBox="0 0 680 330" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>消息抛出与两种结束事件对比</title>
  <desc>消息抛出发消息后流程继续；消息结束发消息后进入结束；终止结束中断一切活动任务与等待，实例直接终态</desc>
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .t{font:400 12px sans-serif;fill:#5F5E5A}
    .blu{fill:#E6F1FB;stroke:#185FA5}.teal{fill:#E1F5EE;stroke:#0F6E56}.red{fill:#FCEBEB;stroke:#A32D2D}.gry{fill:#F1EFE8;stroke:#888780}
    .tb{font:500 14px sans-serif;fill:#0C447C}.tt{font:500 14px sans-serif;fill:#085041}.tr{font:500 14px sans-serif;fill:#791F1F}.tg{font:500 14px sans-serif;fill:#444441}
    .ab{stroke:#185FA5;fill:none}.at{stroke:#0F6E56;fill:none}.ar{stroke:#A32D2D;fill:none}
  </style>

  <g><rect class="blu" x="40" y="52" width="140" height="52" rx="12" stroke-width="0.5"/><text class="tb" x="110" y="72" text-anchor="middle" dominant-baseline="central">消息抛出</text><text class="t" x="110" y="92" text-anchor="middle" dominant-baseline="central">MESSAGE_THROW</text></g>
  <path class="ab" d="M180 78 L222 78" stroke-width="1.5" marker-end="url(#a4)"/>
  <g><rect class="blu" x="224" y="56" width="110" height="44" rx="8" stroke-width="0.5"/><text class="tb" x="279" y="78" text-anchor="middle" dominant-baseline="central">下一节点</text></g>
  <text class="t" x="352" y="74">到达即回调宿主发布器发消息，</text>
  <text class="t" x="352" y="94">流程马上继续——只通报，不等待不结束</text>

  <g><rect class="teal" x="40" y="146" width="140" height="52" rx="12" stroke-width="0.5"/><text class="tt" x="110" y="166" text-anchor="middle" dominant-baseline="central">消息结束</text><text class="t" x="110" y="186" text-anchor="middle" dominant-baseline="central">MESSAGE_END</text></g>
  <path class="at" d="M180 172 L222 172" stroke-width="1.5" marker-end="url(#a4)"/>
  <g><rect class="gry" x="224" y="150" width="110" height="44" rx="8" stroke-width="0.5"/><text class="tg" x="279" y="172" text-anchor="middle" dominant-baseline="central">结束</text></g>
  <text class="t" x="352" y="168">发完消息实例正常完成，</text>
  <text class="t" x="352" y="188">适合归档前通知外部系统（发 webhook / 写日志）</text>

  <g><rect class="red" x="40" y="240" width="140" height="52" rx="12" stroke-width="0.5"/><text class="tr" x="110" y="260" text-anchor="middle" dominant-baseline="central">终止结束</text><text class="t" x="110" y="280" text-anchor="middle" dominant-baseline="central">TERMINATE_END</text></g>
  <path class="ar" d="M180 266 L222 266" stroke-width="1.5" marker-end="url(#a4)"/>
  <g><rect class="red" x="224" y="244" width="130" height="44" rx="8" stroke-width="0.5"/><text class="tr" x="289" y="266" text-anchor="middle" dominant-baseline="central">实例直接终态</text></g>
  <text class="t" x="372" y="262">同时中断其它并行分支的活动任务与等待，</text>
  <text class="t" x="372" y="282">一个分支判死刑、整个实例结束（如风控一票否决）</text>

  <text class="t" x="40" y="322">三者都不等待；前两个需要宿主注册 EventPublisher，终止结束不需要</text>
</svg>
