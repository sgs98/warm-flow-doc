<svg viewBox="0 0 680 320" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>定时捕获与定时边界对比</title>
  <desc>上：定时捕获，流程停在事件节点等时间到；下：定时边界，附着在审批任务上，超时中断任务走异常出口</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .h{font:500 14px sans-serif;fill:#2C2C2A}.t{font:400 12px sans-serif;fill:#5F5E5A}
    .blue{fill:#E6F1FB;stroke:#185FA5}.amb{fill:#FAEEDA;stroke:#BA7517}
    .red{fill:#FCEBEB;stroke:#A32D2D}.grn{fill:#EAF3DE;stroke:#3B6D11}
    .tb{font:500 14px sans-serif;fill:#0C447C}.ta{font:500 14px sans-serif;fill:#633806}
    .tr{font:500 14px sans-serif;fill:#791F1F}.tg{font:500 14px sans-serif;fill:#27500A}
    .ab{stroke:#185FA5;fill:none}.aa{stroke:#BA7517;fill:none}.ar{stroke:#A32D2D;fill:none}.ag{stroke:#3B6D11;fill:none}
  </style>

  <text class="h" x="40" y="42">定时捕获 TIMER_CATCH —— 流程自己停下来等</text>
  <g><rect class="blue" x="40" y="66" width="90" height="44" rx="8" stroke-width="0.5"/><text class="tb" x="85" y="88" text-anchor="middle" dominant-baseline="central">人工A 办完</text></g>
  <path class="ab" d="M130 88 L172 88" stroke-width="1.5" marker-end="url(#a1)"/>
  <g><rect class="amb" x="174" y="60" width="128" height="56" rx="12" stroke-width="0.5"/><text class="ta" x="238" y="80" text-anchor="middle" dominant-baseline="central">定时捕获 3 天</text><text class="t" x="238" y="100" text-anchor="middle" dominant-baseline="central">无待办，流程停留</text></g>
  <path class="ab" d="M302 88 L344 88" stroke-width="1.5" marker-end="url(#a1)"/>
  <g><rect class="blue" x="346" y="66" width="90" height="44" rx="8" stroke-width="0.5"/><text class="tb" x="391" y="88" text-anchor="middle" dominant-baseline="central">人工B 办理</text></g>
  <text class="t" x="452" y="82">到点前：实例停在此处</text>
  <text class="t" x="452" y="102">到点后：沿出口自动继续</text>

  <line x1="40" y1="150" x2="640" y2="150" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>

  <text class="h" x="40" y="186">定时边界 TIMER_BOUNDARY —— 给别人的任务上闹钟</text>
  <g><rect class="blue" x="40" y="212" width="90" height="44" rx="8" stroke-width="0.5"/><text class="tb" x="85" y="234" text-anchor="middle" dominant-baseline="central">人工A 办理中</text></g>
  <g><rect class="amb" x="174" y="206" width="128" height="56" rx="12" stroke-width="0.5"/><text class="ta" x="238" y="226" text-anchor="middle" dominant-baseline="central">边界：3 天闹钟</text><text class="t" x="238" y="246" text-anchor="middle" dominant-baseline="central">附着在人工A 上</text></g>
  <path d="M130 226 C 155 226 150 234 172 234" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="0.5" stroke-dasharray="3 3"/>

  <path class="ag" d="M302 220 L344 212" stroke-width="1.5" marker-end="url(#a1)"/>
  <g><rect class="grn" x="346" y="196" width="128" height="44" rx="8" stroke-width="0.5"/><text class="tg" x="410" y="218" text-anchor="middle" dominant-baseline="central">3 天内办完</text></g>
  <text class="t" x="486" y="222">闹钟取消，正常结束</text>

  <path class="ar" d="M302 248 L344 262" stroke-width="1.5" marker-end="url(#a1)"/>
  <g><rect class="red" x="346" y="256" width="150" height="44" rx="8" stroke-width="0.5"/><text class="tr" x="421" y="278" text-anchor="middle" dominant-baseline="central">超时未办：中断 A</text></g>
  <path class="ar" d="M496 278 L538 278" stroke-width="1.5" marker-end="url(#a1)"/>
  <g><rect class="red" x="540" y="256" width="100" height="44" rx="8" stroke-width="0.5"/><text class="tr" x="590" y="278" text-anchor="middle" dominant-baseline="central">人工C 接手</text></g>
  <text class="t" x="40" y="322">A 被归档为「失效」，不代表审批人同意；C 沿边界出口生成</text>
</svg>
